name: Update BMS Events

on:
  workflow_dispatch:
  schedule:
    - cron: "0 12 * * 5"

permissions:
  contents: write
  pull-requests: write

jobs:
  prepare-matrix:
    name: Discover events
    runs-on: ubuntu-latest
    outputs:
      ids: ${{ steps.discover.outputs.ids }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          workspaces: |
            . -> target

      - name: Discover events from manbow
        id: discover
        run: |
          set -euo pipefail
          # fetcher 日志走 stderr，stdout 为纯 JSON 数组
          ids=$(cargo run --release --quiet -- --list-events --delay-ms 200 | jq -c '[.[].id]')
          count=$(echo "$ids" | jq length)
          if [ "$count" -eq 0 ]; then
            echo "no events discovered" >&2
            exit 1
          fi
          echo "discovered $count events" >&2
          echo "ids=$ids" >> "$GITHUB_OUTPUT"

  update-event:
    name: Update event ${{ matrix.event }}
    needs: prepare-matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        event: ${{ fromJSON(needs.prepare-matrix.outputs.ids) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          workspaces: |
            . -> target

      - name: Build
        run: cargo build --release

      - name: Fetch event data
        run: |
          mkdir -p events
          cargo run --release --quiet -- --event ${{ matrix.event }} --dir events --delay-ms 1000

      - name: Check for changes
        id: check-changes
        run: |
          if [ -n "$(git status --porcelain events/${{ matrix.event }}.toml)" ]; then
            echo "has-changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "has-changes=false" >> "$GITHUB_OUTPUT"
            echo "No changes for ${{ matrix.event }}"
          fi

      - name: Create Pull Request
        id: create-pr
        if: steps.check-changes.outputs.has-changes == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          commit-message: "chore(events): update ${{ matrix.event }} data"
          branch: "chore/update-${{ matrix.event }}"
          title: "chore(events): update ${{ matrix.event }} data"
          body: |
            Automated update for event `${{ matrix.event }}`.
          add-paths: |
            events/${{ matrix.event }}.toml
          labels: |
            automated

      - name: Enable Pull Request Automerge
        if: steps.create-pr.outputs.pull-request-operation == 'created'
        run: gh pr merge "$PR_NUMBER" --auto --merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.create-pr.outputs.pull-request-number }}
