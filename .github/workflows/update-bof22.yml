name: Update BOF:22 Hourly

on:
  workflow_dispatch:
  schedule:
    # 每小时 30 分，错开 update-events.yml 的整点触发，避免同时抓 event 152
    - cron: "30 * * * *"

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    name: Update BOF:22 (event 152)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          workspaces: |
            . -> target

      - name: Build
        run: cargo build --release

      - name: Fetch event data
        run: |
          mkdir -p events
          cargo run --release --quiet -- --event 152 --dir events --delay-ms 1000

      - name: Check for changes
        id: check-changes
        run: |
          if [ -n "$(git status --porcelain events/152.toml)" ]; then
            echo "has-changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "has-changes=false" >> "$GITHUB_OUTPUT"
            echo "No changes for event 152"
          fi

      - name: Create Pull Request
        id: create-pr
        if: steps.check-changes.outputs.has-changes == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          commit-message: "chore(events): update 152 data"
          branch: "chore/update-152"
          title: "chore(events): update 152 data"
          body: |
            Automated hourly update for event `152` (BOF:22), capturing
            score evolution during the judging period.
          add-paths: |
            events/152.toml
          labels: |
            automated

      - name: Enable Pull Request Automerge
        if: steps.create-pr.outputs.pull-request-operation == 'created'
        run: gh pr merge "$PR_NUMBER" --auto --squash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.create-pr.outputs.pull-request-number }}
