Music:Tiv
DLありがとうございます。自称スロカスのTiv(てぃぶ)です。最近は自粛中。
Tiv史上最低な曲ができてしまいました。
最低と言っても倫理観が、ということですがね。
前々から電波を作りたいと思っていたんですが、そんな中で思いついたテーマはズバリ、
「スロットと配信で生計を立てるヤベー奴」
？？？？？？？？
…ってなった方も多いでしょう
電波と言えば、ぶっとんでる感じが特徴なので、それができそうなもので自分にとって身近なもの…「スロット」でした。
もちろんまだ大学生なのでね、ガッポリ投資してるわけでもなく、たまにちょっとだけ消費して楽しむ程度のライト層です。
どういう曲か説明するよりは、キャラクターを紹介したほうがわかりやすいと思うので、
作品内に登場するキャラクター「ギャンブルアイドルななりん」について、簡単な紹介を↓
パチンコ店でスロットを回しながら配信する活動者。
兼業はしておらず、収入源は配信内での投げ銭のみ。
20歳を名乗っているが、実年齢は29歳。
歳不相応な萌え声と攻めたビジュアルで「ななりん」として活動（所謂うわキツ）
地声はすごく低い。
好きな食べ物は焼き鳥とビールで、かなりの酒カス。
配信とパチ屋以外では基本寝てる（ギャンブルしか頭になく完全に末期）
配信外で打ちに行くときは余裕でキレるし台パンする。
見ていただければ分かると思いますが、かなりのカスですこいつ。
愛くるしさを武器に楽してお金を稼いでます。
まあこれも一応生存のための手段の一つかもしれませんが（）
一応ジャンルとしてはポップスに入ると思いますが、雰囲気のギャップは結構あります。
基本は明るめでピコピコ感満載のハピコア系ですが、所々ダークっぽい箇所、ドンク系の箇所、
ブレイクしまくりな箇所など、圧倒的な温度差を感じられるかと思います。
そんなトンデモ問題作に巻き込まれてしまった（他人事）方々を紹介します。
まず、ななりんに声を吹き込んでくださったのは、お馴染みのはらもりよしなさん。
恐らく普段はこういったジャンルを歌うことはないでしょう。みなさんのイメージからもかなりかけ離れているかも。
無理のある萌え声、ドスの効いた地声、配信者として色んな声を出せるというななりんの個性を完璧に表現してくださいました。
無理させてしまったという申し訳なさもありつつ、それでも最高の仕上がりを見せてくださった感謝の気持ちもあります。
続いて、ななりんのデザイン担当及びイラストを描いてくださったのは、こちらもお馴染みのよまおさん。
多分ですが僕がオーダーしない限りここまで攻めたイラスト描いてくれないと思うんですよ。
それでもすごく良い仕上がりを見せてくれたのでマジでありがたい…。
キャラクターはカスだけど、なんか憎めないような愛着が湧くんですよね。
やっぱりこの人すごい。
問題作に巻き込んでしまったことをお詫びいたしますとともに、作品に華を添えてくださったことを改めて感謝を申し上げます。
ありがとうございました！！
マトモさを捨ててネタに全振りしたTiv史上屈指の問題作を、是非お楽しみ頂けますと幸いです。
差分譜面制作は、同梱のノーツ未配置ファイル(_none)からがおすすめです。
拡張子が「bmstemp」となっていますので、適宜変更してご利用ください。
報告は不要ですが、していただけると見に行きます。むしろ見たいです()
