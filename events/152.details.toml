comment = """
お久しぶりです、kanoryoです。
年一でこのイベントが開催されるから、今でも自分は音楽を続けられているんだなと
しみじみ感じる今日この頃でございます。
2015年のデビューから休まず参加できてひとまずホッとしております…なんと11年目
今年はBreaks要素ありのゴシックハードコアを制作しました。
リズムがそれっぽいだけで、従来の音色やグルーヴ感とは程遠いものに
仕上がってしまった感が拭えないですが、ぜひとも楽しんでいただけたらと思います。
曲タイトルとしてはSolitude=孤独という意味合いですが、
「Solo」「エチュード」を感じさせるような
ピアノフレーズをふんだんに盛り込んでおります。
もっとクラシック調にしたかったけど技術が足りなかった…
後半はいつものデカキックです。しかも実質BPM倍になってます。
ソフラン入れようか迷いましたがなんとか踏みとどまりました。
軸がヤバいので頑張ってくださいね！！"""

