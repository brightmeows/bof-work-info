production = "FL Studio 2026"
comment_updated = "2026年10月02日 03:28"
comment = """
(2026年10月02日 03:28 更新)
こんにちは。DJ ANDREA JPです。
今年の2026年5月31日にて18年間BMS界隈を支えてきたLunatic Rave 2のInternet Rankingサーバーが終焉を迎えました。
この楽曲も「終焉の後にて生まれ変わる新たな存在の誕生」のつもりと、この楽曲のジャンルが「BIG BEAT BREAKS」と頭文字が曲名と同じくBBB（onokenさんのBB BLOWと同じ頭文字になったのは100％偶然だが）という事を踏まえて「全宇宙の始まりであるビッグバンの爆発を起こす爆弾」と「ビッグバンの後からどうやって地球や太陽などの太陽系一族が誕生したか、の物語」をイメージして作りました。
なので前回のAscending Memoriesとは打って変わって「渋い路線のビッグビート」として作りました。
むしろスクラッチを多用した譜面も作りたかったので、今回の楽曲において「前々回と前回のBOF楽曲とは一味異なった俺らしい楽曲」でありながら「今までのDJ ANDREA JPによる楽曲とは一味異なった楽曲」のつもりでSPでのNORMALからLEGGENDARIAまでの譜面達とエンドコンテンツ向けのSP ULTIMATE譜面をまとめて作りながらDP譜面達とSP NORMAL譜面と1つのPMS譜面をMister.Himiさんに作らせてもらいました（そのPMS譜面のTOTAL値が513なのは「PMSにしてもゲージがめちゃくちゃ重そう」だと思った事と、それを某PMS向けのTOTAL値計算サイトで計算したら513がむしろ最適、と書いてあったからです）。
ちなみに難易度がSP LEGGENDARIA以上に激ムズであるSP ULTIMATEの差分は「SDVXのEverlasting Messageにおける唯一無二のULTIMATE譜面（IIDXでいうLEGGENDARIA譜面みたいなやつ）」がモチーフだけど、こう見えて元々それをLEGGENDARIAとして実装しようとしたらやんたすさんから「いくらLEGGENDARIAであっても難易度がエグすぎる」という指摘を受けたので「ヒミさんが作ったSP BEGINNERをSP NORMALにずらす」という手法で旧SP LEGGENDARIAをSP ULTIMATEにずらす事にしたんです。
おまけに自由な譜面制作をサポートする為のサービスとして、「キー音を全てバック側のレーン達に整列した譜面制作用bmxファイル」のbmxファイルも同梱しています。
そんなLR2というサービスが終わっても今後にてそれを引き継ぐ新たなBMSプレイヤー及びBMS-IRなどの次世代版LR2IRが誕生したり、或いはbeatorajaなどの後継作が活性化する事を願っています。
特に最近登場したbeatmania IIDX 34 ZINRAIの選曲画面における曲名の色がLR2とbeatmania IIDX INFINITASと同じく「上がグレーで下が紫色」という事もあるので、多分だけど「LR2のサービスが終わったのでKONAMIは時効としてZINRAIにおける新曲での曲名の文字色をSPADA以来の紫色に戻した」や「beatmania IIDX INFINITASがサービス開始してから約11年も経ったので、それを祝う為にそのINFINITASと同じ文字色にした」とかの可能性もあると思います。
特に来年はbeatmaniaシリーズの30周年だし、かつbeatmania IIDX 24 SINOBUZにおいてクリア難易度が歴代最強クラスのMare NectarisとICARUSダリアのAC降臨10周年でもあるので、どうせぐらいならそのZINRAIのイメージカラーがLEGGENDARIAカラーと同じく紫と黒という事に合わせてあの黒MENDESや黒卑弥呼がMENDESダリアと卑弥呼ダリアとして降臨しちゃえば、上記のMare NectarisとICARUSダリアによるSINOBUZでの難易度インフレを凌駕する盛り上がりを起こせると思います（ただし上級者達が黒MENDESや黒卑弥呼とかのせいで「俺の☆12全クリアを返せ！(# ﾟДﾟ)」とマジギレしたらそこは申し訳ないです）。
最後に、俺は当分の間BOFシリーズとかには参加しない事を検討しています。
理由は単純に「俺が患っている自閉症が災いして俺が暴走したらBOFシリーズの作品登録期間などの大事なタイミングにて俺は入院される他そのBMS作品を登録すらできないまま失格になってしまう」という現実に危惧しているからだけでなく、単純に「KONAMIが大好きならBEMANIではなくKONAMIにちゃんと貢献しろ」という、KONAMI大好きマンとしての使命があるからです。
もちろん今回を持って俺が今後のBOFシリーズには当分参加しなくても、俺は今後も引き続き作曲しながらIIDXとBMSを遊び続けながら偶にBMS作品を作るつもりです。
その時は「このBIG BANG BOMBをきっかけに俺が新たな形として新たなDJ ANDREA JPの楽曲が誕生する」という事を考慮すれば嬉しいです。
なので今後もよろしくお願いします。
Enjoy. :)"""

