Hex Margarita:
Hey, this is Hex a.k.a. Roxx
I have something to say about this work
L'eau à Paris, which translates to "Water in Paris(Perrier maybe?)", has a very peculiar story behind its title
Roughly speaking, there is a hip-hop imp on the Chinese internet who posts a lot of rage bait content. And when arguing with others, he was like, "If you haven't listened to the album in my profile pic, don't you dare say you've heard rap."
Then, a couple of guys decided to pull a fast one on him by cooking up a fake album called "Water in Paris," and they managed to hook him in the end
Of course, that guy admitted his mistake
I didn't use this title for any personal attack purpose, I just wanted to quote it as something that "won't happen"
Also, I want to thank my bro kdcysth for collaborating with me
kdcysth:
Ayy ChatGPT, help me generate a brief introduction to Perrier.
Perrier is an abstract rap album, a nebulous rap album, a post-punk rap album, and also a jazz album"""

