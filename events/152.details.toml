comment = """
SP NORMAL - ☆04
SP HYPER - ☆10
SP ANOTHER - ☆12
◇◆◇◆◇
こんにちは！ハルガスミです。
普段はTwitterに住みつきながら、不定期で"ジェネリック音ゲーVTuber"として
BMS等の音ゲー配信を嗜んでおります(VTuberとして活動しているわけではありません)。
無名戦2025で制作した『フーディー・バニーガール』の正統派続編ファンク楽曲を作ろうとしたけど
Aメロ以降全くアイデアが浮かばなくなって数ヶ月部屋の中で狂ってたらこの曲ができてました。ファンクどこ？
そんな『ムーンライズ・バニーガール』ですが、
"『フーディー・バニーガール』以上にベースが主役！"をテーマに制作しました。
また今回は定義数に余裕がありそうだったので、ドラムのベロシティもかなり細かくしています。
ピアノは添え物です。元々音ゲーらしいソロパートもあったのですが、ベースが主役なので意図的に削りました。
結果的に派手な楽曲ではなくなりましたが、ベースのスラップ感とドラムの演奏感を感じてもらえたら嬉しいです。
よろしくお願いします。
(readmeは、もうちょっと長いです。)
ハルガスミ
Twitter：https://x.com/halgasumi
YouTube：https://www.youtube.com/@halgasumi
★☆★SPECIAL THANKS!!★☆★
◎イラスト提供
・水森なつる 様(https://x.com/minanatu)"""

