※このBMSファイルはLR2、beatorajaで動作確認しています。
【アクセルファンク ソフラン攻略想定方法】
パターン1「白鍵盤1下げ」
・前提条件として、beatorajaの起動設定画面で「HI-SPEED変化間隔」が初期値の0.25から変わっていないこと
・SELECTまたはSTARTボタンを押しながら白鍵盤1回で142→185の対応ができると思います
パターン2「皿チョン」
・前提条件として、beatorajaの起動設定画面で「HI-SPEED固定自動調整」にチェックを入れていること
・加速するパートは「チュン」という音でフレーズが終わるためそこを利用して皿チョンする
・#37の皿からやる
・ただ、小節線頭で加速するのである程度耐性必要かも"""

