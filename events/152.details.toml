thaIassophobla
0phldlan
Genre:lndustrlaI Hardcore
BPM:176
Team: THE BASS GUARDIANS 続
BGA:sdjge
"Into the Silence"
Simply put, for a long time I've noticed that mainstream rhythm game music doesn't seem to include Industrial Hardcore—especially the kind of grand, melodic, atmospheric, and highly cinematic Hardcore music like Ophidian's. So I wrote this track based on my own ideas and entered this event under this very interesting name.
The structure of the track might be a bit long, and it may not sound very suitable for rhythm games. And although I tried very hard to make my track sound like it was written by Ophidian himself, due to technical issues I found that I wasn't able to incorporate the essence of Ophidian into this track. I suppose that's a bit of a regret?
But in any case, enjoy the music and have fun playing!"""

