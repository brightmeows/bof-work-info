「狂花水月」(Moonstruck Blossom)のメタルアレンジになります。
原曲は儚さと切なさ、妖艶で美しい様が前面に出た曲で、この曲に出会った時はかなり衝撃的でした。
クイン・セクトニアの狂いがこの曲にマッチしすぎていてアレンジで大きく崩さないようにしたいと考え、
