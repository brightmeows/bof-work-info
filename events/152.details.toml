主人公の名前は「蝦 ボリ」、相棒の名前は「エアレンデル」です
ボリちゃんが宇宙に行くという夢を叶えようとする姿を見て応援するエアレンデルちゃん、どちらも見事だと思いませんか？
「終わり」だと言うまで終わらない二人の物語を、ぜひ見守ってください！
KimAutomne - ^_^
この作品は62進数bmsです
プレイの前にご確認ください"""

