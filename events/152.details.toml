Hello! Az3 here.
This track is something that came out originally as a concept of being in an upcoming gimmick album.
But, I'm currently on the planning and production phase of the said album, and this track is one of them.
I'm not going to keep the concept confidential.
SAMPLELOOPBREAKER will be a future upcoming series project that will contain 100 tracks.
Each tracks has its own number label, and as those number increases the length increases by 60 seconds.
Starting at Track 1 which is exactly 60 seconds, up until Track 90 which should be 9:54 in length.
Hence, Track 11 (this one) is exactly 2 minutes or 120 seconds long.
I'm currently thinking of polishing the concept of this highly ambitious album that will take me more than 5 years.
But the gimmick of the album is that all tracks have something in common, samples.
Whether it's from a sample pack, recording, from cleared existing songs (with permission), I have to make a track based off of it.
And for Track 11, it focuses on drum breaks.
In addition, my charting approach with this one is slightly different compared to my usual style.
I'm prioritizing the need for repetition and variety and this track seems to be the perfect opportunity to try and experiment.
Same thing with five states of weirdness, Ersatz Passiflora, and seven states of dreamscapes,
this track was made and planned to release for my birthday. ^^
