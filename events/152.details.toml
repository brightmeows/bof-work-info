[[details]]
num = "87"
artist = "もるもる   URL"
genre = "Jazzy Drum & Bass"
genre_sub = "Original・Self"
source = "-----"
bga = "BGA include・none"
charts = "CHART_3 (★x3～★x12)"
bpm = "120 ～ 180"
tags = [
    "7Keys",
    "Lang-JP",
    "Video-sharing",
    "Use-BGA",
    "Use-mpeg_movie",
    "Use-mp4_movie",
    "Gimmick-Soflan",
    "Difficulty-intermediate",
    "Difficulty-senior",
    "Difficulty-gorilla",
]
production = "Logic Pro XMotion (Apple)"
comment = """
Astuce
～さあ、駆け引きしよう～
最近ピラティスができるようになりました、もるもるです。
今年はDTMが自分の中でちょいちょい来てまして、曲の発想がたくさん浮かんでくるんですよね。
マイブームはちょっと早めに職場に行き、爆音で歌いながら仕事をすることです^^
ボイトレにも通い始めたので、そろそろ自分の曲を歌ってみたりしたいなぁと。
そしてなんと、今年度のBOFはハルガスミさんとTivさんからチームのお誘いをお受けしました！！
素直にうれしい！！
その誘いのDMにも気づかず、二週間も放置してしまいました。
Tivさんほんとすみませぬ。。。
XのDMリクエスト通知が来ないような仕様にしたのはどこのどなたでしょうか（怒）
さあそろそろ楽曲のお話をしましょう。
Astuceはフランス語で
「巧妙、アイデア、駆け引き、工夫、コツ」
とかいう意味です。
はい、今回もイントロ8小節で満足しちゃいましたパターンです。
続きを書くまで1年半かかりました。
テーマはジャズっぽいドラムンベース。ドラムンベース書いたことないし、から始まりました。
今回の曲ですが、
実はVospiさんリスペクトです。
この方の曲はしんみりしたメロディにバチバチのベースがとっても癖になるんです。
そんな曲を、わたしは書きたい。（宮沢賢治風）
ただただドラムンベースを書くのは面白くないかな、とか考え始め、
ジャズっぽくしたりスカっぽくしたりしたかったんですが。
実は途中まであんまりうまいこと仕上がっとらんかったのです。。。
BOFで名前を出すのは約5年ぶりくらいになるとは思いますが、
僕の愛人（仮）、WKCKゆってぃにアドバイスをいただきました。
ゆってぃは音大院卒なので、とってもこういうのにくわしい。
ゆってぃ「ジャズというのはキレイな拍をとった瞬間にしぬ」
...ん？スカもドラムンも無理じゃね？
なら明確に小節でジャンル区切ってまお！
一貫性を持たせるために使うドラムや楽器の音色はさほどブラさず、うまいことまとまりました。
音数はいつも通りそんな多くないですが、後半の盛り上がりは何回聴いても絶頂モンっすわ。
なんとジャケットにハルガスミさんがいます。僕のモチーフキャラもいます。
服デザインもるもる、絵師さんは鰹野烏帽子さんです！
ジャケットかっくぃいい！！ありがとうございます！！
オセロ書いてもらったんですが、オセロの駆け引きとか裏技ってどんなもんですかね。
角絶対取るマンとか？
そしてなんと！！！ソフトウェアが7年も放置されてました！！！！
人生初！CG映像づくり！！！
作りはじめはめーーーーーっちゃ時間かかりましたが、
後半になるにつれ、作業に慣れてくるもんですね。
また来年までに光源の良い置き方学んどきましょう。
譜面！たぶんかつてないほど難しい。
最近新筐体の9keysをゲーセンでぱちぱちしているからか、譜面がだんだん見えるようになってきました。とはいえまだまだ初心者です。
BMSのプレイ動画見たんですが、皆さんは多少難しくてもゴリゴリに押せるゴリラであるということがわかったので（鬼失礼）
階段まみれにしてやりました。insane挑戦してみてね。チャレンジは一年生から。"""

