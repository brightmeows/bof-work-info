comment_updated = "2026年10月07日 14:06"
comment = """
(2026年10月07日 14:06 更新)
Tropixies是我本人初次独立完成的BMS作品，除了插图以外，谱面、作编曲、BGA均由本人完成。同时，它也是各种意义上颇为复古的一作，希望它能以视听内容展现这点——尤其推荐大家使用Beatmania IIDX的皮肤来游玩及预览谱面。
我一共制作了四种不同难度的谱面——很难想象，这竟然会是一个没玩过几次IIDX的音游玩家的杰作吧。实际上，写谱时，我的确一边考虑乐器演奏采音的连贯性，一边用手模拟键型在桌面上敲空气，制谱工作就是这样进行的。
参与BOF是我7年以来一直怀揣着的梦想，这是一个很长的故事。原本我是一个sif玩家，sif作为ip企划下挂靠的音游，一般被称为亚音游；而真正让我迈入纯音游的，是sif玩家群里，给我介绍Arcaea的几位如今少有交集的朋友。从此，我对电子乐以及各种混合风格的乐曲产生了浓厚的兴趣，加上玩音游也还算有一点点天赋（游玩能够不断给我提供正反馈），于是我开始广撒网，尝试各种不同的音游。说到音游，Beatmania必然是一座难以撼动的里程碑，BOF于民间梦想家而言，更是十分神圣的存在。我自己本身喜欢弹钢琴并录制一些简单的曲目，也藉由此机，开始学习用电脑软件编写、制作音乐。那时我就在想，有朝一日，我也要制作出自己的BMS作品，参加BOF这样不可思议的比赛。今年，2026年，时机成熟，我总算能够参与到这样盛大的活动中来，第一次不作为旁观者，而是参与者。
至于曲子，实际上它的动机最早写于将近一年半前，只是一个普通的夜里再寻常不过的即兴——彼时我尚未拥有足够的能力去完成全曲定稿，因此一直用着自己的方式摸爬滚打，终于得到了用于制谱的版本。关于流派——Latin Jazz Trance——我有很多想说的。这并不是一个真正的流派，只是对一种组合可能性的尝试。我酷爱dj Taka、wavetraxx、Robert Miles制作的Trance及其子流派曲目，同时又在节奏及和弦色彩上十分喜爱Jazz Music，尤其是Latin Jazz中的Montuno节奏型。能不能将这两种我钟爱的流派放在一起呢？带着这样的想法，我得到了相当满意的答案——尽管我的技术实在惨不忍睹，但至少，Tropixies诞生了。
Tropixies这个名字也颇有讲究，它是Tropical与Galaxies的结合——Tropical Galaxies，热带星系，意为在热带仰望所能见到的星空。我为它想象了一个美丽的故事——一对眷侣，在荒无人烟的热带小岛上，支起一簇微渺的篝火，震撼于美丽的星空，于是像群星闪烁般一同起舞。这个故事也在插画及BGA中有所体现，这里郑重感谢akiya2003为我制作了非常切题的插画。
BGA嘛，就随意多了。故事与基调基本奠定的情况下，我的脑海中已经产生了草稿，于是我使用了剪映自带的素材库完成全部剪辑，自己也对于这个BGA的创作相当满意。当然，在细节上，我也下了些功夫，比如使用滤镜做旧、试图复刻千禧年以及早期beatmania BGA比较富有特色的排版风格——我希望能够以此致敬beatmania。
如果您能够一路阅读到这里，无论是通过翻译器，还是您也是中文母语者，我都将不胜感激。我的梦想即是成功提交作品到会场、参赛成功，仅此而已。我会羡慕能够提交更优质作品的BMS作者，但我依旧感谢愿意坚持梦想的自己。
可以的话，我还希望能够特别鸣谢Rigël Theatre先生。在我对于编曲非常迷茫与困顿的一个阶段，他曾提供过一些堪比救命稻草的建议，使我真正能够不放弃作编曲这个爱好。"""

