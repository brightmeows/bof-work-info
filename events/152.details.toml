과거의 본인을 용서하기란 쉽지 않은 법이지만, 사람들은 앞을 보고 사는 법이랍니다.
그리고 그 미래는 지금 당신의 행동으로부터 쓰인다구요?
정장을 입은 당신도, ‘이벤트 복장’을 입은 당신도, 모두 당신입니다.
