[くるやのぶ]
今年のゲ実家は～～～カーチェイスだ～～～！
くるやのぶです、キャノンボーラーは当時ANCHORも解禁してました
今回は楽曲のテーマを車、レース、ドライブみたいなところでチームで揃えつつ
自分がやりたかったことが一つありまして
今回のBOFから推奨フォーマットがbeatorajaのみになったので
速度変化の対応方法がある意味統一されたのでこのタイミングで
ギアチェン配慮してわかりやすいソフランの譜面にしたいというのがありました
beatorajaでプレイされていればおそらく初見でもそれっぽく対応できるんじゃないかなと思います
初見配慮の為に想定している攻略法はreadmeの一番下に載せておきます↓↓↓
そしてそして今回もLianさん、フォルティッシモさん、plumさん、portionさんに譜面を作っていただきました！！
また同梱譜面のテストプレイをBMS担当2人上記4人に加えチームのあんこさんにもしていただき納得の譜面クオリティになりました
特にソフラン周りは、ちゃんと対応できそうかという点があったので多くの人に見て頂いて本当にありがたかったです
2026年10月8日
