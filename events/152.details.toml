(Updated October 1, 2026, 23:16)
NOTE!
Echa is currently registered in THE BASS GUARDIANS Continued as "!", and BASSKNIVES will use "-·" alias for creating the BGA.
BMS metadata also displays "-·" to "_." as the character isn't supported in some BMS clients.
I hope you understand the confusion.
-------------------- Information ---------------------
Genre: sample breaktanica
Title: the world of viridian
Artist: OfficialAz3 feat. Echa
BPM: 205
BGA: ! x -·
BMS: OfficialAz3, Z6W2A, R054
---------------------- lang=en -----------------------
Living a world full of nothing but a color.
This tormenting paradise surely has some more.
Letting the astronaut suffer through endless bore.
Was it beautiful as he once claimed anymore?
Or was it an excuse to live on an eyesore?
the art of rebirth.
Viridis color orbem terrarium vincat.
///
Hello! Az3 here. ^^
As of writing this README, I'm currently in a state of being very very busy due to my university thesis.
the world of colors return with a brand new color, viridian!
I've had this concept stuck around in my head back when I was still producing the world of viridian.
And since knowing that I'm approaching the first three as if it was a RGB trio, I told myself, why not do green next?
And so, the world of viridian is born.
This is also the perfect time to tell everyone that this is one of my attempts in creating a botanica work.
And knowing the process, I can confidently say that I horribly suck at it.
But I'll keep doing better, and in doing so I've tried to innovate by combining it to breakcore, which is the main premise of the series.
So, using botanica as the hybrid genre for breakcore felt really really appropriate.
It's kind of unfortunate that the production of this had to coincide with my university's internship program.
But I managed to finish this early before it even happened, and I had lots of fun sound designing this.
Did you know some of the basses you can hear are made from the sound of printers?
In addition, I want to say special thanks to Echa as he provided recording of spoken poetry and the most confusing vocal choir arrangement ever.
Originally this wasn't supposed to have any, but Echa really insisted and it somehow made one of the drops really heavy.
Also, I took inspiration to Tsubaki's works "BlackLobelia." and "WhiteIris." for writing out the literature and how it's arranged with the music.
Anyways, that is all. I hope you can enjoy this world and hope to discover more upcoming colors in the future.
Next one will take a different approach on how the story progression goes. ^^
I also want to give special thanks to BASSKNIVES who goes by the alias "-·" for providing us BGA resources to create this wonderful BGA! ^^
The current theme of this work is about "the rebirth and your awe witnessing it".
