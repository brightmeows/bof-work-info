comment_updated = "2026年09月04日 22:20"
comment = """
(2026年09月04日 22:20 更新)
(2026年08月11日 07:16 更新)
歴史は苦手だけど歴史を調べるのは好きです4Gです。
ハイチ革命をモチーフにヴードゥー音楽の要素を入れたブレイクビーツに仕立ててみました。
パット聴きじゃ全然わからんなこれ。
曲名がヘンテコですが「荒れ果てた時代から視た見解」という意味を込めてます。曲名がヘンテコですが。
歴史上の出来事を考えるときは現代の価値観だけではなく、ありとあらゆる当事者の目線を考察すべきだと思うんですよ。
なので、ただひたすらに起きた出来事を時系列に並べるように作ってみました。BGMっぽさに拍車がかかってますが。
みんなも自分なりの答えを考えてみようぜな。わたしゃまだ答えのコの字も思いつかねえがな。
スクラッチとギターはオートメーションとポルタメントの塊だから全部手作業で切りました。
ギターはともかくスクラッチ562音はしんどい。
そしていつも通りPMSはノープレーでフィニッシュ。環境ないのねん。
Q,これほんとにブレイクビーツ？
A.ちゃんと切り貼りしたブレイクビーツだよ。問題なのは全部BGMに回っていることだけど。
Q.ピアノの音が割れてる。
A.最初から割ってるので仕様です。
Q.なんかLove is gone by sectorηのフレーズが流れてるんだけど。
A.無関係ではないのでねじ込みました。
Q,なんでソフランしてるの？
A.各BPMで起承転結を表したつもりです。上でも書いたように時系列で考えていたので。
Q.タイトル画像ナニコレ？
A.生存本能と怒りを抽象化したつもりです。良か素材が3つ見つかりましたのでいつもの調子でまぜまぜキメラ画像。"""

