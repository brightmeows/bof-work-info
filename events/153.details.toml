comment = """
(2026年08月16日 17:42 更新)
こんにちは、YtzkAです。
今回はULTRA SHUFFLE Lv.4に申し込んだらブータンをひきました。
ブータンに関して知っているのはヒマラヤ山脈に囲まれた小さいくに、くらいで
シャッフル結果を見た途端図書館でブータンに関した本を借りに行きました。
しかし図書館で見つけた本は一冊だけ。
ということで曲のコンセプトは不思議な国で山登りをするような、自然の音に浸れるトランスにしました。
曲名のDzongkhaはブータンの首都ティンプーなどで話される言語です。
ジャンルは基本トランスで、ブータンをイメージして作りましたのでDrukを付けてDrukotranceにしました。
ちなみにDrukはDzongkha語で「竜」を意味して、ブータンを指す「Druk Yul」は「竜の国」らしいです。
以前からトランスは作ってみたかったので今回のきっかけで実績を一つ解除した気分です。
それではこれからもよろしくお願いします。"""

