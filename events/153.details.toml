comment = """
(2026年08月19日 00:33 更新)
メロディックプログレッシブハウスに挑戦してみました。
初めて作りましたがこんな難しいジャンルと思いませんでした。
とにかくいらんことするとすぐ破綻する。
ピアノバッキングをいれてみよう！ → 普通のハウスになる
アタック感をおさえてみよう！ → ディープハウスになる
アタック感を強めてみよう！ → トロピカルハウスになる
リズムをくずしてみよう！ → エレクトロニカになる
くりかえしすぎだな・・・コード進行を変えてみよう → おちつかなくなる
転調させてみよう → おちつかなくなる
テンポを速くする → トランスになる
スネアロールでビルドアップだ！ → トランスになる
シンバル シャンシャンシャン → トランスになる
声ネタ入れる → 蛇足感半端ない
粉飾できない分、旋律と構成に集中するしかない、作ってみて面白いジャンルでした。
いつかもう一度作ってみたいです。
難儀しすぎて譜面１個しかつくる時間ありませんでした。差分で追加するかもです。
余談ですがアルゼンチンはプログレッシブハウスがさかんらしいです。"""

