comment_updated = "2026年08月11日 01:21"
comment = """
(2026年08月11日 01:21 更新)
Genre Shuffle4にてアヴァンギャルドとかいうトンチキジャンルを引き、苦しみながら何とか作り上げた前回の製作。
そして今回WW2にて「さすがにアヴァンギャルドより悩むような結果にゃならんやろ、ワンチャン惑星引いたるわ」
と調子こいてLv4でガチャした結果サントメ・プリンシペを引きました。
( ＾ω＾)・・・
まず国のことすら存じ上げず、YouTubeで調べてみるも日本語だと観光してらっしゃる方のVlogが数件出てくるのみ。
色々調べてみると、70～80年代に流行ったらしいPuxa（プシャ）というジャンルに辿り着き、CDを発見。
ギター、ベースを始め恐らく地域のものであろう打楽器を中心に使用した陽気な音楽。
生音を使った作曲をこれまでほぼやったことないので苦労すること請け合い。ここで数ヶ月アイデアの寝かせという名の放置。
往生際が悪いので更に色々調べ回った結果、どうやらサントメ・プリンシペではAfro Houseが流行っているらしい。
ということで、Puxaの陽気な雰囲気とAfro Houseのシャレオツな雰囲気を混ぜたような楽曲になりました。
無理なこじつけをせず作れた自分を褒めたいと思います。
曲名はポルトガル語で島を意味するイーリャにしました。なんか語感が好きだったので。
BGIは鷲羽山の展望台からの景色です。撮影時の外気温35℃でした。
地元では瀬戸内海のサントメ・プリンシペと専らの噂です嘘です。"""

