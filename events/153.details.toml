comment_updated = "2026年08月16日 21:13"
comment = """
(2026年08月16日 21:13 更新)
【4983】
こんにちは、4983です！2014年の戦[sen-goku]國 〜甲午の乱〜以来久しぶりに参加することになりました。その間元気に過ごしていましたか？今回の曲はMacGuffin #26、普段主に作っているTechno系ではなくHARD DANCE風の曲として参加しました。
もともとは本当に久しぶりにInnocent Wallsを聴いて「私もこんな曲を作りたい」と思い取り組み始めました。しかし、作れば作るほど元のモチーフから遠ざかり曲の雰囲気がHARD DANCEに近づいてきたため悩んでいるうちに「そういえばHARD DANCEと言えばSTELLAR WINDではないか！」と思い、方向性を変えたという事情があります。
前述の通り今回の曲はL.E.D.先生のHARD DANCEやHARD TRANCE系の楽曲、そしてHARD DANCEというジャンルで公開された複数の曲を参考にして制作しました。リファレンス一を基に私のスタイルを表現しましたが、いかがでしょうか、似ていると感じますか？最初の意図とは違いましたが、結果的に主に使っていたTechnoから外れたジャンルを作れたので新鮮な気持ちで楽しかったです！
特にKickサウンドは当時L.E.D.先生が使用していた音を参考にし似たように再現しようと心血を注いだ結果、なかなか似たサウンドが作れました。そしてこの過程で本当に多くのことを学んだので本当に良かったと思います。
譜面とBGAは今回も同様にSmiGoonさんが作成してくださいました。今回はBGAを他の方に依頼しようとしたのですが募集がなく急いでSmiGoonさんにお願いしたところ、急いでお願いしたにもかかわらず期限内に完成していただきました。本当にありがとうございます！
それでは、今回のBMSも楽しくお楽しみください！
私の作品の2次創作に関するガイドラインを私のツイッターのメインツイートに設定しましたので、ぜひご参考ください！
この曲のリファレンス一覧は以下の通りです：
STELLAR WIND - L.E.D.
THE DOOR INTO RAINBOW - L.E.D.
Innocent Walls - TaQ
Time 4 Dance - RedFOX
【SmiGoon】
こんにちは、SmiGoonです。4983さんと同様に久しぶりに参加することになりました。もともとはBMSとして参加しようと思っていましたがいろいろな事情で結局今回はサポート役として参加することになりました。
ある時点からMacGuffinシリーズの譜面が似通って定型化したように感じて悩んでいましたが、4983さんが私の意見を聞いてくださり、今回は曲やキー音の抽出などに少し変化を加えて少し違う雰囲気で譜面を作ることができました。ドラムループを細かくカットしたり、SFXを活用できるようにしたり···些細な違いなので大きく感じないかもしれませんがおかげで私はスムーズに作業できました。ありがとうございます、4983さん。
BGAは本当に久しぶりにbeepleさんの公開ソースを活用しました。以前2016年に一度使ったのが10年ぶりですね。4983さんが求めていた色味とイメージがあったのでそれに合わせるためにできるだけ合う素材を中心に編集したのですが、私の動画編集技術があまり優れていないため完璧に表現できなかったことが少し残念です。動画編集を学ばなければならないのか···
それでは、今回もどうぞよろしくお願いします。
【出典表記】
タイトル画像と映像はbeepleさんが作成したソースを活用して制作されました。
https://www.beeple-crap.com/"""

