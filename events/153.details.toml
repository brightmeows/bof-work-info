comment_updated = "2026年08月15日 23:16"
comment = """
(2026年08月15日 23:16 更新)
お久しぶりに挨拶できて嬉しいです。
神奈川県民のエルトリンディーと申します。
…噓です。
コミケのため今は神奈川にいるだけです。
茶番はここまでですけど、
およそ十年近くの間、スランプが長くなると不可能の連鎖に入ってしまうという事を学びました。
曲を作る方法を忘れて、曲を作る心得を忘れて、何が好きで曲を作り始めたのかすら忘れて…
いつまでもこうしてはいけない、と思って本当に何も考えずに、自分が好きで、したいことが何なのかだけを考えながら作りました。
タイトルは「ホルロソギ」と発音できると思いますが、「一人で立つ」の韓国語発音を利用したダジャレみたいな言葉遊びですので、「Standalone」など、どれでも好きな形で読んでくださったら嬉しいです。
21年のPABATで、自分をアニメに例えると第3期のエンディングに対応するとおしゃった事があります。
今回の曲が第4期のオープニングになって欲しいと思います。
(それなら今後も色々作らなきゃだめですね；)
まだまだも未熟者ですが、何卒よろしくお願い申し上げます。"""

