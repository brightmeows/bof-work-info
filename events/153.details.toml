ぼくは韓国発のゲームを遊ぶことが多いのですが、中でもPr○ject Moonシリーズは、これまで触れてきた作品の中でも特に心に残っているタイトルです。
今回はそんなPr○ject Moonシリーズの世界観をイメージした楽曲を制作しました。
ネオンが照らす夜の路地裏。今日もまた、便利屋たちは依頼をこなすため、静かに街を駆けていく――
そんな情景を思い浮かべながら、プレイしていただければ嬉しいです。
