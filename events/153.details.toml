comment_updated = "2026年08月17日 01:49"
comment = """
(2026年08月17日 01:49 更新)
========
あとがき
ジャンルが決まった日の夜、友人のDavidsanと話していたら、「ジンバブエ音楽はやりやすいよ。Kalimbaをたくさん使えばそれっぽくなるから」と教えてもらいました。
そのあと少し調べてみたら、ジンバブエの伝統音楽って、Mbira(Kalimbaの先祖のような楽器)一つとシェイカー一つだけでも成立するんです。
でもそれだけじゃなくて、もっと複雑な曲を作りたいなあ．．．
まずは良いムビラのサンプルパックを探そう！と思っていろいろ探したのですが、結局どれもしっくり来ませんでした。
代わりに、Kalimba職人さんにお願いして、ジンバブエで実際に使われているような、ビール瓶の栓を使ったジリジリとした響きが加わるパーツを付けたムビラを特注してもらいました。(その職人さんとはすっかり仲良くなって、その後はムビラ録音専用のプリアンプまでお願いして作ってもらいました。）
そして、とても暑い夏の夜、エアコンを切って、ムビラを録音しました。
本当に死ぬほど暑かった！
ビジュアル面については、最初はまったくアイデアがなくてネットでネタを探していました。すると、海外でとんでもない高額面のジンバブエドル紙幣がプリントされたTシャツを見つけて、「これだ！」と思い、そのまま通販で特注して、撮影用の素材にしました。
最後に、なぜFootworkを選んだのかという話ですが、Footwork自体がサンプリング遊びと相性のいいジャンルだからです。さらに、どこかエスニックな雰囲気もあって、アフリカというテーマにもぴったりだと感じ、このスタイルを選びました。
そんなこんなで、最終的にはなんだかすごく変な作品になりました（笑）
========
