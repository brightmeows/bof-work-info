comment_updated = "2026年08月28日 19:38"
comment = """
(2026年08月28日 19:38 更新)
(2026年08月11日 00:17 更新)
music // 輝橋シトラ
みんな～！元気にしていますか～？
私ですか？新人BMS作家（嘘）の輝橋シトラ、です！
（ちなみに輝橋はテルハシと読みます）
本来、レソトって高山地帯だから
「雪の王国」というテーマで曲を作っていたら
どうしても曲が完成されないのでボツにして
別の曲を用意する羽目になった私、輝橋シトラ。
そんななか、代わりの曲を作ろうとして
レソトの音楽ってどんなのがあるんだろうって調べたら
めっちゃレゲエしか出てこないわけ。
そんでレゲエにしたら、よくよく考えたらゲーム的に面白くないわけ。
端的にいえば高難易度譜面が作れないわけ。
なので後半はスカにしちゃったわけ。
ちなみにスカ要素を入れるときの話なのですが
HARISEN MASTER ヒフミ -HIHUMI-さんのから助力がありました。
アイデア提供ありがとうございます。
…ここで、単刀直入にお伺いします。
「これってレゲエっスカ？」
以上です。
PS.輝橋シトラを日本語に変えると、twinkle citrusになります。偶然かな？
Arrange Support // HARISEN MASTER ヒフミ -HIHUMI-
いつの間にか編曲サポートをしたHIHUMIと申します。
ANOTHER譜面も担当いたしました。
SKAといえばやはりカウベル！
それでは聞いてください………
「操リ人形ノ舞ニ意味ハ有ルカ」
lyrics & vocal // REGGAESKA MASTER 高樹 -TAKAKI-
夏はイヤだ。
REGGAESKA MASTER 高樹 -TAKAKI-です。
夏は楽しんでいるか？オレっちは全然楽しめてねぇんだよ！
夏は胸を刺激しねぇよ！ナマ足魅惑のマーメイドなんかねぇよ！
いるのは家の中で叫んでいるオレっちしかねぇんだよ！
エアコン最強！扇風機最強！録音楽しいし！セロリはうまいし！
………とか言ってもオレっちも夏を満喫してぇんだよ！
だから外で大暴れ……したくても恥ずかしくてさ……
結局のところめっちゃ恥ずかしながら撮影したっていう、そういうお話だよ。
そんなオレっちの夏の過ごし方をご紹介！
残りの作業の締めを切る。以上！！！！！！！！！！！！！！
PS.ちなみに歌詞はレソト語だよ。出来れば翻訳してみ↓
https://docs.google.com/document/d/16PL1qOs_5JrWb-rxobY4SsobXXyvyWiAoOgNsxIKZOI/edit?usp=sharing
music & movie // 高樹夕運
どうも初めまして、高樹夕運と申します。
タカキ・ユウンと読みます。以後お見知りおきを。
いやぁ外熱かったですね。
輝橋さんよくも外で撮影させたねホンマに。
で、REGGAESKA MASTER 高樹 -TAKAKI-さんホンマにお疲れ様でした。
よくあんな格好で撮影出来てますね。熱くないのか？
あんな服着てあんなグラサンかけてあんなマスクかぶって窮屈しねえのか？
ホンマに尊敬ですわホンマに。自分には真似できませんね。
あと名前に関して周りに聞いたら「夕運よりは夕雲の方がよくない？」って言われまして。
次やるときは高樹夕雲でお会いしたいです。
高樹夕運でした。
PS.譜面担当になんか知らねぇやつが混じってるなぁ…誰なんだろう。
movie // Exclamation mark
なんやかんやあって参加することになりました、Exclamation markです。
こんなにふざけた姿をどうやったらもっとふざけた姿に変換できるか悩みに悩んだ結果、
真の「クソコラ」がなんなのかを見せつけるために、のーみそからっぽにして指とマウスとキーボードを動かしました。
（もちろん、コメントを書いている今現在もなお、それはお変わりなく。）
せっかく勇気を出して自ら直接武器になってくれたのに、鍛冶屋の人がその武器を強化せざるを得ない状況でした。
そこでご本人様が「思いっきりいじってくれ」と言わんばかりだったので自信がつきまして筆が伸びちゃったんです。
あと、これを見る前や見た後にどれだけ「何か」が頭をよぎったとしても
それを口にしてはいけません。
ひょっとするとあなたが「そういう人間」と誤認されるかもしれませんのでご注意ください。
今日も安全に一日をお過ごしください。
必ず自分自身の身のために最先を尽くしてください。
それでは、どうかこのBMSをご堪能ください。
GO! GO! GO! GO!
GO! GO! GO! GO!"""

