comment_updated = "2026年09月04日 22:21"
comment = """
(2026年09月04日 22:21 更新)
テーマは現代神話。娯楽としてのオカルトがシェアワールドとして広まり新たなる神話体系になった。
考えてみれば大昔の神話も吟遊詩人などが謡うことによる娯楽であったことから、
現代神話も遠い未来では古典神話となり、また新たな神話が生まれるのであろうか。
LemurAgeという曲名はレムリア大陸と時代の鞄語です。
BM68星雲を引いたときはどうしたものかと思いましたがとっさにオセアニアで申請したことが功を奏しました。
いやまあレムリア大陸はオセアニアではないですがルルイエと縁が深い地域ですからね。
ということで表現したいことは決まったので以下3点を主軸に据えて制作しました。
・FM音源を使って娯楽作品的な仕上がりにする
・突飛なコード進行と不協和音スレスレの編曲を目指す
・若干のホラーテイストに哀愁感を両立させる
上手くいってるといいなあ。
使用素材にエルシャダイのフリー素材があるけど大丈夫だ、問題ない。
見たことないフォントの権利者は私だ、問題ない。
ソックリサンガイルケドワタシウチュウジンネ。BM98セウインヲトメニキタダケネ。
フカクツイキュウスルナラメンインブラックノケイネ。ピカー。"""

